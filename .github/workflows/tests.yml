name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Тесты (без сети и ключа)
        run: pytest -q

      - name: Прогон без ключа (--replay)
        run: python -m revizor examples/requirements.md out/report.md --replay

      - name: Оценка по эталону
        run: python eval/score.py out/report.json

      - name: Линтер и формат (ruff)
        run: |
          pip install ruff
          ruff check .
          ruff format --check .

      - name: Проверка типов (mypy)
        run: |
          pip install mypy
          mypy
