<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ревизор ТЗ — Переводы по номеру телефона</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--ink:#16181d;--muted:#5d6472;--line:#e3e6eb;--soft:#eef1f5;
  --accent:#1f6feb;--accent-soft:#e7f0ff;
  --crit:#d1242f;--crit-soft:#fde8e9;--major:#c96a00;--major-soft:#fff1de;--minor:#9a7d00;--minor-soft:#fdf7d7;
  --ok:#1a7f37;--ok-soft:#e3f5e8;--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--panel:#171a21;--ink:#e7e9ee;--muted:#9aa3b2;--line:#2a2f3a;--soft:#1e222b;
  --accent:#4c8dff;--accent-soft:#1a2740;
  --crit:#ff6b6b;--crit-soft:#3a1d21;--major:#ffa94d;--major-soft:#3a2a17;--minor:#e6c84f;--minor-soft:#33301a;
  --ok:#4ade80;--ok-soft:#173022;}}
:root[data-theme="dark"]{
  --bg:#0f1115;--panel:#171a21;--ink:#e7e9ee;--muted:#9aa3b2;--line:#2a2f3a;--soft:#1e222b;
  --accent:#4c8dff;--accent-soft:#1a2740;
  --crit:#ff6b6b;--crit-soft:#3a1d21;--major:#ffa94d;--major-soft:#3a2a17;--minor:#e6c84f;--minor-soft:#33301a;
  --ok:#4ade80;--ok-soft:#173022;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:600;font-size:13px}
.verdict{padding:10px 16px;border-radius:12px;font-weight:700;font-size:16px}
.verdict.no{background:var(--crit-soft);color:var(--crit)}
.verdict.yes{background:var(--ok-soft);color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:26px;line-height:1.1}
.kpi span{color:var(--muted);font-size:13px}
.kpi.crit b{color:var(--crit)}.kpi.major b{color:var(--major)}.kpi.minor b{color:var(--minor)}.kpi.ok b{color:var(--ok)}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:6px}
nav button{border:0;background:none;color:var(--muted);padding:10px 12px;font:inherit;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
nav button.active{color:var(--accent);border-bottom-color:var(--accent)}
.panel{display:none}.panel.active{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sev-critical{border-left:4px solid var(--crit)}.sev-major{border-left:4px solid var(--major)}.sev-minor{border-left:4px solid var(--minor)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);margin:2px 4px 2px 0}
.pill.critical{background:var(--crit-soft);color:var(--crit)}.pill.major{background:var(--major-soft);color:var(--major)}.pill.minor{background:var(--minor-soft);color:var(--minor)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.meta{color:var(--muted);font-size:13px}
.quote{display:block;border-left:3px solid var(--accent);background:var(--accent-soft);padding:6px 10px;margin:6px 0;border-radius:4px;cursor:pointer}
.quote small{display:block;color:var(--muted)}
.rewrite{background:var(--ok-soft);border-radius:8px;padding:8px 10px;margin-top:8px}
dl{margin:8px 0 0;display:grid;grid-template-columns:150px 1fr;gap:4px 12px}
dt{color:var(--muted);font-size:13px}dd{margin:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input,.filters select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
table{border-collapse:collapse;width:100%;background:var(--panel);font-size:13px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft);position:sticky;top:44px}
.scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
.scroll th{top:0} /* внутри контейнера с прокруткой отступ 44px сдвигал заголовок на первую строку */
.doc{font-family:var(--mono);font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.ln{display:grid;grid-template-columns:52px 1fr 150px;border-bottom:1px solid transparent}
.ln .n{color:var(--muted);text-align:right;padding:1px 10px 1px 0;user-select:none}
.ln .t{white-space:pre-wrap;word-break:break-word;padding:1px 8px}
.ln .m{padding:1px 8px;font-family:system-ui,sans-serif;font-size:11px}
.ln.h-critical{background:var(--crit-soft)}.ln.h-major{background:var(--major-soft)}.ln.h-minor{background:var(--minor-soft)}
.ln.flash{outline:2px solid var(--accent)}
.ln .m a{color:inherit;font-weight:700;margin-right:4px;text-decoration:none;cursor:pointer}
.heat td{text-align:center;min-width:34px}
.heat th{position:static}
.heat td.c-critical{background:var(--crit);color:#fff}.heat td.c-major{background:var(--major);color:#fff}.heat td.c-minor{background:var(--minor);color:#fff}
.heat th.v{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;height:150px;font-weight:600}
.opt{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);color:var(--ink)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
code{font-family:var(--mono);font-size:12.5px;background:var(--soft);padding:1px 5px;border-radius:4px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 16px}
.flow span{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.flow i{color:var(--muted);font-style:normal}
.theme{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
@media (max-width:720px){.ln{grid-template-columns:40px 1fr}.ln .m{grid-column:2}dl{grid-template-columns:1fr}}
@media print{nav,.filters,.toolbar,.theme{display:none}.panel{display:block!important}}
</style>
</head>

no": 26, "text": "Платежи → Перевод по номеру. Поля «Телефон», «Сумма, ₸», «Сообщение». Перед подтверждением показывается полное ФИО получателя и комиссия. Кнопка «Отправить».", "page": null, "section": "Часть A. Новый функционал › Дизайн процесса UI"}, {"no": 27, "text": "", "page": null, "section": "Часть A. Новый функционал › Дизайн процесса UI"}, {"no": 28, "text": "### Требования к изменениям", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям"}, {"no": 29, "text": "", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям"}, {"no": 30, "text": "#### BPMN схема процесса", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › BPMN схема процесса"}, {"no": 31, "text": "Ввод номера → поиск получателя → расчёт комиссии → антифрод → списание → зачисление → уведомление.", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › BPMN схема процесса"}, {"no": 32, "text": "", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › BPMN схема процесса"}, {"no": 33, "text": "#### Функциональные требования", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › Функциональные требования"}, {"no": 34, "text": "* **Ф-1.** Клиент переводит деньги со своей карты KZT получателю по номеру телефона в формате +7XXXXXXXXXX. Поддерживаемые банки получателя: Kaspi, Halyk и др.", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › Функциональные требования"}, {"no": 35, "text": "* **Ф-2.** Сумма одного перевода — от 100 до 500 000 ₸.", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › Функциональные требования"}, {"no": 36, "text": "* **Ф-3.** Переводы до 20 000 ₸ в месяц выполняются без комиссии. Сверх лимита взимается комиссия 1%.", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › Функциональные требования"}, {"no": 37, "text": "* **Ф-5.** Месячный лимит бесплатных переводов обнуляется в начале месяца.", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › Функциональные требования"}, {"no": 38, "text": "* **Ф-6.** Повторное нажатие «Отправить» не должно приводить к двойному списанию. Подробности приведены в Ф-7.", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › Функциональные требования"}, {"no": 39, "text": "", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › Функциональные требования"}, {"no": 40, "text": "### Sequence Diagram", "page": null, "section": "Часть A. Новый функционал › Sequence Diagram"}, {"no": 41, "text": "Приложение → сервис переводов: создать перевод. Сервис переводов → антифрод: проверить операцию. Сервис переводов → шлюз: списать и зачислить. Шлюз → уведомления: отправить push отправителю и получателю.", "page": null, "section": "Часть A. Новый функционал › Sequence Diagram"}, {"no": 42, "text": "", "page": null, "section": "Часть A. Новый функционал › Sequence Diagram"}, {"no": 43, "text": "### Нефункциональные требования", "page": null, "section": "Часть A. Новый функционал › Нефункциональные требования"}, {"no": 44, "text": "Перевод должен проходить быстро и надёжно, сервис должен выдерживать высокую нагрузку.", "page": null, "section": "Часть A. Новый функционал › Нефункциональные требования"}, {"no": 45, "text": "", "page": null, "section": "Часть A. Новый функционал › Нефункциональные требования"}, {"no": 46, "text": "### Требования к интеграции", "page": null, "section": "Часть A. Новый функционал › Требования к интеграции"}, {"no": 47, "text": "Приложение создаёт перевод через дочерний документ «Переводы по номеру телефона — REST API».", "page": null, "section": "Часть A. Новый функционал › Требования к интеграции"}, {"no": 48, "text": "", "page": null, "section": "Часть A. Новый функционал › Требования к интеграции"}, {"no": 49, "text": "### Требования к тестированию", "page": null, "section": "Часть A. Новый функционал › Требования к тестированию"}, {"no": 50, "text": "TBD", "page": null, "section": "Часть A. Новый функционал › Требования к тестированию"}, {"no": 51, "text": "", "page": null, "section": "Часть A. Новый функционал › Требования к тестированию"}, {"no": 52, "text": "### Критерии приемки", "page": null, "section": "Часть A. Новый функционал › Критерии приемки"}, {"no": 53, "text": "", "page": null, "section": "Часть A. Новый функционал › Критерии приемки"}, {"no": 54, "text": "| Исходные условия | Действие | Ожидаемый результат |", "page": null, "section": "Часть A. Новый функционал › Критерии приемки"}, {"no": 55, "text": "| :--- | :--- | :--- |", "page": null, "section": "Часть A. Новый функционал › Критерии приемки"}, {"no": 56, "text": "| Переводы за месяц 0 ₸ | Перевести 15 000 ₸ | Комиссия 0 ₸ |", "page": null, "section": "Часть A. Новый функционал › Критерии приемки"}, {"no": 57, "text": "| Переводы за месяц 0 ₸ | Перевести 25 000 ₸ | Комиссия 0 ₸ |", "page": null, "section": "Часть A. Новый функционал › Критерии приемки"}, {"no": 58, "text": "| Баланс карты 1 000 ₸ | Перевести 99 ₸ | Ошибка «Минимальная сумма 100 ₸» |", "page": null, "section": "Часть A. Новый функционал › Критерии приемки"}, {"no": 59, "text": "", "page": null, "section": "Часть A. Новый функционал › Критерии приемки"}, {"no": 60, "text": "### Ревью требований", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 61, "text": "", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 62, "text": "| Проверка | Создано или доступно | Проверено | Примечания |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 63, "text": "| :--- | :--- | :--- | :--- |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 64, "text": "| Требование может быть протестировано | Да / Нет | Да / Нет | |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 65, "text": "| Поддерживается версионность документа / зафиксирована | Да / Нет | Да / Нет | |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 66, "text": "", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 67, "text": "### Блок согласующих", "page": null, "section": "Часть A. Новый функционал › Блок согласующих"}, {"no": 68, "text": "", "page": null, "section": "Часть A. Новый функционал › Блок согласующих"}, {"no": 69, "text": "| Подразделение | ФИО ответственного | Подпись |", "page": null, "section": "Часть A. Новый функционал › Блок согласующих"}, {"no": 70, "text": "| :--- | :--- | :--- |", "page": null, "section": "Часть A. Новый функционал › Блок согласующих"}, {"no": 71, "text": "| | | |", "page": null, "section": "Часть A. Новый функционал › Блок согласующих"}, {"no": 72, "text": "", "page": null, "section": "Часть A. Новый функционал › Блок согласующих"}, {"no": 73, "text": "---", "page": null, "section": "Часть A. Новый функционал › Блок согласующих"}, {"no": 74, "text": "", "page": null, "section": "Часть A. Новый функционал › Блок согласующих"}, {"no": 75, "text": "## Часть B. REST API", "page": null, "section": "Часть B. REST API"}, {"no": 76, "text": "", "page": null, "section": "Часть B. REST API"}, {"no": 77, "text": "Дочерний документ части A: «Переводы по номеру телефона — REST API».", "page": null, "section": "Часть B. REST API"}, {"no": 78, "text": "", "page": null, "section": "Часть B. REST API"}, {"no": 79, "text": "### Общие параметры", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 80, "text": "", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 81, "text": "| Поле | Значение |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 82, "text": "| :--- | :--- |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 83, "text": "| **Description** | Создание перевода по номеру телефона |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 84, "text": "| **REST type** | GET |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 85, "text": "| **Authorization** | Bearer, сессия клиента |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 86, "text": "| **Request URL** | `/transfers/create` |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 87, "text": "", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 88, "text": "### Логика работы метода", "page": null, "section": "Часть B. REST API › Логика работы метода"}, {"no": 89, "text": "1. Проверить сессию клиента.", "page": null, "section": "Часть B. REST API › Логика работы метода"}, {"no": 90, "text": "2. Найти получателя по номеру телефона.", "page": null, "section": "Часть B. REST API › Логика работы метода"}, {"no": 91, "text": "3. Рассчитать комиссию.", "page": null, "section": "Часть B. REST API › Логика работы метода"}, {"no": 92, "text": "4. Отправить операцию в антифрод и списать сумму.", "page": null, "section": "Часть B. REST API › Логика работы метода"}, {"no": 93, "text": "5. Вернуть результат перевода.", "page": null, "section": "Часть B. REST API › Логика работы метода"}, {"no": 94, "text": "", "page": null, "section": "Часть B. REST API › Логика работы метода"}, {"no": 95, "text": "### Параметры запроса", "page": null, "section": "Часть B. REST API › Параметры запроса"}, {"no": 96, "text": "", "page": null, "section": "Часть B. REST API › Параметры запроса"}, {"no": 97, "text": "#### Query-параметры", "page": null, "section": "Часть B. REST API › Параметры запроса › Query-параметры"}, {"no": 98, "text": "", "page": null, "section": "Часть B. REST API › Параметры запроса › Query-параметры"}, {"no": 99, "text": "| Parameter | Format | Size | Mandatory | Logic | Description |", "page": null, "section": "Часть B. REST API › Параметры запроса › Query-параметры"}, {"no": 100, "text": "| :--- | :--- | :--- | :--- | :--- | :--- |", "page": null, "section": "Часть B. REST API › Параметры запроса › Query-параметры"}, {"no": 101, "text": "| `phone` | string | 12 | Да | +7XXXXXXXXXX | Телефон получателя |", "page": null, "section": "Часть B. REST API › Параметры запроса › Query-параметры"}, {"no": 102, "text": "| `amount` | integer | 32 bit | Да | 1–1 000 000 | Сумма перевода, ₸ |", "page": null, "section": "Часть B. REST API › Параметры запроса › Query-параметры"}, {"no": 103, "text": "| `cardId` | string | 1–64 | Да | Карта клиента | Карта списания |", "page": null, "section": "Часть B. REST API › Параметры запроса › Query-параметры"}, {"no": 104, "text": "", "page": null, "section": "Часть B. REST API › Параметры запроса › Query-параметры"}, {"no": 105, "text": "### Ответ", "page": null, "section": "Часть B. REST API › Ответ"}, {"no": 106, "text": "Если результат 200 — успешный. При повторе возвращается 409.", "page": null, "section": "Часть B. REST API › Ответ"}, {"no": 107, "text": "", "page": null, "section": "Часть B. REST API › Ответ"}, {"no": 108, "text": "| Parameter | Format | Logic | Description |", "page": null, "section": "Часть B. REST API › Ответ"}, {"no": 109, "text": "| :--- | :--- | :--- | :--- |", "page": null, "section": "Часть B. REST API › Ответ"}, {"no": 110, "text": "| `status` | string | OK / ERROR | Результат перевода |", "page": null, "section": "Часть B. REST API › Ответ"}, {"no": 111, "text": "| `amount` | string | При успехе | Сумма перевода |", "page": null, "section": "Часть B. REST API › Ответ"}, {"no": 112, "text": "| `fee` | string | При успехе | Комиссия, ₸ |", "page": null, "section": "Часть B. REST API › Ответ"}, {"no": 113, "text": "", "page": null, "section": "Часть B. REST API › Ответ"}, {"no": 114, "text": "### Статусы", "page": null, "section": "Часть B. REST API › Статусы"}, {"no": 115, "text": "", "page": null, "section": "Часть B. REST API › Статусы"}, {"no": 116, "text": "**200.** Перевод выполнен.", "page": null, "section": "Часть B. REST API › Статусы"}, {"no": 117, "text": "**400.** Неверные параметры запроса.", "page": null, "section": "Часть B. REST API › Статусы"}, {"no": 118, "text": "**401.** Требуется авторизация.", "page": null, "section": "Часть B. REST API › Статусы"}], "criteria": {"necessary": {"name": "Необходимость", "level": "requirement", "source": "29148 п. 5.2.5", "definition": "Требование задаёт важную возможность или ограничение; без него продукт неполон, а его удаление ничего не ломает только если оно лишнее."}, "appropriate": {"name": "Уместность (без лишних проектных решений)", "level": "requirement", "source": "29148 п. 5.2.5", "definition": "Требование описывает что нужно, а не как реализовать; уровень детализации соответствует уровню документа."}, "unambiguous": {"name": "Однозначность", "level": "requirement", "source": "29148 п. 5.2.5; IEEE 830 п. 4.3.2", "definition": "Формулировку можно понять только одним способом; термины, единицы, границы, часовые пояса и состояния определены."}, "complete": {"name": "Полнота", "level": "requirement", "source": "29148 п. 5.2.5; IEEE 830 п. 4.3.3", "definition": "Требование не нуждается в дополнении: описаны условия, реакции на ошибки и граничные/альтернативные случаи."}, "singular": {"name": "Атомарность", "level": "requirement", "source": "29148 п. 5.2.5", "definition": "Одно требование — одна возможность или одно ограничение."}, "feasible": {"name": "Реализуемость", "level": "requirement", "source": "29148 п. 5.2.5 и 5.2.6", "definition": "Требование можно реализовать в заданных ограничениях (технических, временных, архитектурных) с приемлемым риском."}, "verifiable": {"name": "Проверяемость", "level": "requirement", "source": "29148 п. 5.2.5; IEEE 830 п. 4.3.6", "definition": "Есть объективный конечный способ доказать выполнение: измеримый результат, точка измерения, условия."}, "correct": {"name": "Корректность", "level": "requirement", "source": "29148 п. 5.2.5; IEEE 830 п. 4.3.1", "definition": "Требование точно отражает потребность и не противоречит цели, бизнес-правилам и предметной области."}, "conforming": {"name": "Соответствие шаблону", "level": "requirement", "source": "29148 п. 5.2.5", "definition": "Требование оформлено по принятому шаблону: идентификатор, раздел, обязательные поля и атрибуты заполнены."}, "consistent": {"name": "Непротиворечивость", "level": "set", "source": "29148 п. 5.2.6; IEEE 830 п. 4.3.4", "definition": "Требования, критерии приёмки и части документа не противоречат друг другу; термины и единицы используются единообразно."}, "set_complete": {"name": "Полнота набора", "level": "set", "source": "29148 п. 5.2.6; IEEE 830 п. 4.3.3", "definition": "Набор покрывает цель и все значимые сценарии, ошибки, состояния и интерфейсы; нет пустых обязательных разделов и «TBD»."}, "comprehensible": {"name": "Понятность", "level": "set", "source": "29148 п. 5.2.6", "definition": "Из набора ясно, что ожидается от системы и как требования связаны; термины определены."}, "validatable": {"name": "Возможность валидации", "level": "set", "source": "29148 п. 5.2.6", "definition": "Можно доказать, что выполнение набора достигает бизнес-цели (есть критерии приёмки, измеримые цели)."}, "ranked": {"name": "Ранжированность", "level": "set", "source": "IEEE 830 п. 4.3.5", "definition": "У требований указаны важность и/или стабильность (приоритеты)."}, "modifiable": {"name": "Модифицируемость", "level": "set", "source": "IEEE 830 п. 4.3.7", "definition": "Структура позволяет вносить изменения без дублей и рассинхронизации; документ версионируется."}, "traceable": {"name": "Трассируемость", "level": "set", "source": "IEEE 830 п. 4.3.8; 29148 п. 5.2.8", "definition": "У требований есть уникальные идентификаторы и связи с источником, критериями приёмки и реализующими спецификациями."}, "language": {"name": "Язык требований", "level": "requirement", "source": "29148 п. 5.2.7", "definition": "Нет субъективных и размытых слов, лазеек («по возможности»), незамкнутых перечислений («и т.д.»), неизмеримых сравнений."}, "risk": {"name": "Риски ИБ и эксплуатации", "level": "requirement", "source": "Чек-лист ревью (ИБ, операционные риски)", "definition": "Требование не создаёт рисков информационной безопасности, утечки персональных и карточных данных, операционных рисков; предусмотрены откат и контроль."}}, "severity_names": {"critical": "Критично", "major": "Существенно", "minor": "Замечание"}, "kind_names": {"functional": "функциональное", "nonfunctional": "нефункциональное", "data": "данные", "integration": "интеграция", "interface": "UI", "api": "API", "acceptance": "критерий приёмки", "process": "процесс", "constraint": "ограничение"}, "agent_names": {"segmenter": "Нарезчик", "analyst": "Аналитик", "qa": "Тестировщик", "architect": "Архитектор", "security": "ИБ и риски", "consistency": "Согласованность набора", "judge": "Судья", "clarifier": "Уточнения", "recheck": "Перепроверка"}, "counts": {"requirements": 29, "open": 27, "critical": 6, "major": 12, "minor": 9, "questions": 10, "blocking": 5, "resolved": 0}}</script>

function openTab(name){

// ---------- defects
const state = {sev:new Set(['critical','major','minor']), crit:'', q:'', open:true};
function reqChip(rid){ const r = reqById[rid]; return `<span class="pill" title="${esc(r ? r.summary : '')}">${esc(rid)}${r && r.source_id ? ' · ' + esc(r.source_id) : ''}</span>`; }
function defectCard(f){
  const ev = f.evidence.map(e => `<span class="quote" data-line="${e.line_start}">«${esc(e.quote)}»<small>${esc(e.location)}</small></span>`).join('');
  const status = f.status === 'resolved' ? `<span class="pill ok">закрыто уточнением</span>` : f.status === 'changed' ? `<span class="pill">изменено после уточнения</span>` : '';
  return `<article class="card sev-${f.severity}" id="${f.fid}">
    <h3><span class="pill ${f.severity}">${SEV[f.severity]}</span>${esc(f.fid)}. ${esc(f.title)} ${status}</h3>
    <div class="meta">${esc(crit(f.criterion))} — ${esc((D.criteria[f.criterion]||{}).source||'')} · обнаружили: ${esc(who(f.sources))}</div>
    <div>${f.requirement_ids.map(reqChip).join('')}</div>
    ${ev}
    <dl><dt>Проблема</dt><dd>${esc(f.problem)}</dd><dt>Что исправить</dt><dd>${esc(f.recommendation)}</dd>
    ${f.status_comment ? `<dt>После уточнения</dt><dd>${esc(f.status_comment)}</dd>` : ''}</dl>
    ${f.rewrite ? `<div class="rewrite"><b>Предлагаемая формулировка:</b> ${esc(f.rewrite)}</div>` : ''}
  </article>`;
}
// предложения добавить защитную меру, о которой документ молчит, — отдельным блоком после дефектов формулировок
const isRisk = f => f.criterion === 'risk' && f.severity !== 'critical'
  && /^(отсутств|нет\s|не\s+(предусмотрен|задан|описан|определ|указан)|не хватает)/i.test(f.title.trim());
function renderDefects(){
  const crits = [...new Set(D.findings.map(f => f.criterion))];
  const list = D.findings.filter(f => state.sev.has(f.severity) && (!state.crit || f.criterion === state.crit)
     && (!state.open || f.status !== 'resolved')
     && (!state.q || (f.title + f.problem + f.recommendation + f.evidence.map(e=>e.quote).join(' ')).toLowerCase().includes(state.q)));
  const prio = D.findings.filter(f => f.priority > 0 && f.status !== 'resolved').sort((a,b) => a.priority - b.priority);
  $('p-defects').innerHTML = `
    <div class="card"><h3>Итог</h3><div>${esc(D.verdict.summary)}</div>
      ${prio.length ? `<p class="meta" style="margin-bottom:4px">Исправить в первую очередь:</p><ol style="margin:0">${prio.map(f => `<li><a href="#${f.fid}">${esc(f.fid)}</a> — ${esc(f.title)}</li>`).join('')}</ol>` : ''}
    </div>
    <div class="filters">
      ${['critical','major','minor'].map(s => `<button class="chip ${state.sev.has(s)?'on':''}" data-sev="${s}">${SEV[s]}</button>`).join('')}
      <select id="f-crit"><option value="">Все критерии</option>${crits.map(c => `<option value="${c}" ${state.crit===c?'selected':''}>${esc(crit(c))}</option>`).join('')}</select>
      <input id="f-q" placeholder="Поиск по дефектам" value="${esc(state.q)}">
      <label class="meta"><input type="checkbox" id="f-open" ${state.open?'checked':''}> только открытые</label>
      <span class="meta">Показано: ${list.length} из ${D.findings.length}</span>
      <button class="btn ghost" id="dl-csv" title="Для Excel и импорта в Jira">Скачать CSV</button>
    </div>
    ${list.filter(f => !isRisk(f)).map(defectCard).join('') || (list.some(isRisk) ? '' : '<p class="meta">Нет дефектов по выбранным фильтрам.</p>')}
    ${list.some(isRisk) ? `<h3 style="margin-top:24px">Рекомендации ИБ и эксплуатации (дополнительно к критериям 29148 и IEEE 830)</h3>
      <p class="meta">Защитные меры, о которых документ молчит: это предложения добавить требования по чек-листу ревью банка, а не дефекты существующих формулировок. Учтены в общем числе дефектов; критичные риски и риски в конкретных формулировках показаны выше, среди дефектов.</p>
      ${list.filter(isRisk).map(defectCard).join('')}` : ''}`;
  document.querySelectorAll('[data-sev]').forEach(b => b.onclick = () => { const s=b.dataset.sev; state.sev.has(s)?state.sev.delete(s):state.sev.add(s); renderDefects(); });
  $('f-crit').onchange = e => { state.crit = e.target.value; renderDefects(); };
  $('f-q').oninput = e => { state.q = e.target.value.toLowerCase(); clearTimeout(window._t); window._t = setTimeout(() => { renderDefects(); $('f-q').focus(); const v=$('f-q').value; $('f-q').setSelectionRange(v.length,v.length); }, 250); };
  $('f-open').onchange = e => { state.open = e.target.checked; renderDefects(); };
  $('dl-csv').onclick = downloadDefectsCsv;
  document.querySelectorAll('.quote').forEach(q => q.onclick = () => goLine(+q.dataset.line));
}

// ---------- document view
function renderDoc(){
  const marks = {};
  for (const f of D.findings) { if (f.status === 'resolved') continue;
    for (const e of f.evidence) { if (!e.line_start) continue;
      for (let n = e.line_start; n <= (e.line_end || e.line_start); n++) {
        const m = marks[n] || (marks[n] = {sev:'minor', ids:[]});
        if (SEV_RANK[f.severity] < SEV_RANK[m.sev]) m.sev = f.severity;
        if (!m.ids.includes(f.fid)) m.ids.push(f.fid);
  }}}
  const reqStart = {};
  for (const r of D.requirements) if (r.evidence.line_start) (reqStart[r.evidence.line_start] ||= []).push(r.rid);
  $('p-doc').innerHTML = `<p class="meta">Исходный документ построчно. Подсвечены строки, на которые ссылаются дефекты; нажмите на номер дефекта, чтобы открыть его.</p>
   <div class="doc">${D.doc_lines.map(l => { const m = marks[l.no];
     return `<div class="ln ${m ? 'h-' + m.sev : ''}" id="L${l.no}"><span class="n">${l.no}</span><span class="t">${esc(l.text)}</span><span class="m">${(reqStart[l.no]||[]).map(r => `<span class="pill">${r}</span>`).join('')}${m ? m.ids.map(id => `<a data-f="${id}">${id}</a>`).join('') : ''}</span></div>`; }).join('')}</div>`;
  document.querySelectorAll('[data-f]').forEach(a => a.onclick = () => { openTab('defects'); state.sev = new Set(['critical','major','minor']); state.crit=''; state.q=''; state.open=false; renderDefects(); setTimeout(() => document.getElementById(a.dataset.f)?.scrollIntoView({behavior:'smooth', block:'center'}), 50); });
}
function goLine(n){ if (!n) return; openTab('doc'); const el = $('L' + n); if (!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); }

// ---------- CSV для Excel и Jira: разделитель «;», UTF-8 с BOM
function downloadDefectsCsv(){
  // защита от CSV-инъекции: «=», «+», «-», «@» в начале ячейки Excel считает формулой
  const cell = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const prio = {critical:'Highest', major:'High', minor:'Low'};
  const rows = [['ID','Критичность','Приоритет Jira','Критерий','Требования','Заголовок','Проблема','Что исправить','Предлагаемая формулировка','Где в документе','Статус']];
  for (const f of D.findings) rows.push([f.fid, SEV[f.severity], prio[f.severity], crit(f.criterion), f.requirement_ids.join(', '), f.title,
    f.problem, f.recommendation, f.rewrite, f.evidence.map(e => e.location).join('; '),
    f.status === 'resolved' ? 'закрыт уточнением' : f.status === 'changed' ? 'изменён' : 'открыт']);
  const csv = '﻿' + rows.map(r => r.map(cell).join(';')).join('\r\n');
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
  link.download = 'defects.csv'; link.click();
}
