<title>Ревизор ТЗ — Уведомление о расходах по карте</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--ink:#16181d;--muted:#5d6472;--line:#e3e6eb;--soft:#eef1f5;
  --accent:#1f6feb;--accent-soft:#e7f0ff;
  --crit:#d1242f;--crit-soft:#fde8e9;--major:#c96a00;--major-soft:#fff1de;--minor:#9a7d00;--minor-soft:#fdf7d7;
  --ok:#1a7f37;--ok-soft:#e3f5e8;--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--panel:#171a21;--ink:#e7e9ee;--muted:#9aa3b2;--line:#2a2f3a;--soft:#1e222b;
  --accent:#4c8dff;--accent-soft:#1a2740;
  --crit:#ff6b6b;--crit-soft:#3a1d21;--major:#ffa94d;--major-soft:#3a2a17;--minor:#e6c84f;--minor-soft:#33301a;
  --ok:#4ade80;--ok-soft:#173022;}}
:root[data-theme="dark"]{
  --bg:#0f1115;--panel:#171a21;--ink:#e7e9ee;--muted:#9aa3b2;--line:#2a2f3a;--soft:#1e222b;
  --accent:#4c8dff;--accent-soft:#1a2740;
  --crit:#ff6b6b;--crit-soft:#3a1d21;--major:#ffa94d;--major-soft:#3a2a17;--minor:#e6c84f;--minor-soft:#33301a;
  --ok:#4ade80;--ok-soft:#173022;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:600;font-size:13px}
.verdict{padding:10px 16px;border-radius:12px;font-weight:700;font-size:16px}
.verdict.no{background:var(--crit-soft);color:var(--crit)}
.verdict.yes{background:var(--ok-soft);color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:26px;line-height:1.1}
.kpi span{color:var(--muted);font-size:13px}
.kpi.crit b{color:var(--crit)}.kpi.major b{color:var(--major)}.kpi.minor b{color:var(--minor)}.kpi.ok b{color:var(--ok)}

nav button{border:0;background:none;color:var(--muted);padding:10px 12px;font:inherit;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}

.sev-critical{border-left:4px solid var(--crit)}.sev-major{border-left:4px solid var(--major)}.sev-minor{border-left:4px solid var(--minor)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);margin:2px 4px 2px 0}
.pill.critical{background:var(--crit-soft);color:var(--crit)}.pill.major{background:var(--major-soft);color:var(--major)}.pill.minor{background:var(--minor-soft);color:var(--minor)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.meta{color:var(--muted);font-size:13px}
.quote{display:block;border-left:3px solid var(--accent);background:var(--accent-soft);padding:6px 10px;margin:6px 0;border-radius:4px;cursor:pointer}
.quote small{display:block;color:var(--muted)}
.rewrite{background:var(--ok-soft);border-radius:8px;padding:8px 10px;margin-top:8px}
dl{margin:8px 0 0;display:grid;grid-template-columns:150px 1fr;gap:4px 12px}
dt{color:var(--muted);font-size:13px}dd{margin:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input,.filters select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
table{border-collapse:collapse;width:100%;background:var(--panel);font-size:13px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft);position:sticky;top:44px}
.scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
.doc{font-family:var(--mono);font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.ln{display:grid;grid-template-columns:52px 1fr 150px;border-bottom:1px solid transparent}
.ln .n{color:var(--muted);text-align:right;padding:1px 10px 1px 0;user-select:none}
.ln .t{white-space:pre-wrap;word-break:break-word;padding:1px 8px}

.ln.h-critical{background:var(--crit-soft)}.ln.h-major{background:var(--major-soft)}.ln.h-minor{background:var(--minor-soft)}
.ln.flash{outline:2px solid var(--accent)}
.ln .m a{color:inherit;font-weight:700;margin-right:4px;text-decoration:none;cursor:pointer}
.heat td{text-align:center;min-width:34px}
.heat th{position:static}
.heat td.c-critical{background:var(--crit);color:#fff}.heat td.c-major{background:var(--major);color:#fff}.heat td.c-minor{background:var(--minor);color:#fff}
.heat th.v{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;height:150px;font-weight:600}
.opt{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);color:var(--ink)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
code{font-family:var(--mono);font-size:12.5px;background:var(--soft);padding:1px 5px;border-radius:4px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 16px}
.flow span{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.flow i{color:var(--muted);font-style:normal}
.theme{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
@media (max-width:720px){.ln{grid-template-columns:40px 1fr}.ln .m{grid-column:2}dl{grid-template-columns:1fr}}
@media print{nav,.filters,.toolbar,.theme{display:none}.panel{display:block!important}}
</style>
</head>

) и ответе (string, L156-L157). Какова целевая архитектура данного API?", "why": "Использование GET для модификации данных вызывает проблемы кэширования и риски ИБ, а 200 OK при ошибке ломает стандартную обработку REST-клиентами.", "options": ["Изменить метод на POST/PUT, возвращать HTTP 400 Bad Request при ошибках валидации и привести типы к integer/boolean", "Сохранить HTTP GET, но при ошибках валидации возвращать HTTP 400 Bad Request и унифицировать типы данных", "Оставить текущую спецификацию без изменений"], "finding_ids": ["D-05", "D-15", "D-17"], "requirement_ids": ["R-14", "R-19", "R-25", "R-27", "R-28", "R-32", "R-33"], "blocking": true, "answer": ""}, {"qid": "Q-05", "addressee": "Разработка", "question": "В требованиях к данным (L49) указано: «сумму покупки в тиынах... и порог в тенге», а в UI (L29) порог и сумма за месяц отображаются в ₸. На каком слое и по какому правилу выполняется пересчёт тиынов в тенге при сравнении сумм?", "why": "Несогласованность единиц измерения приведет к ошибкам округления и ложным или отсутствующим срабатываниям триггера push.", "options": ["Сервис расходов суммирует тиыны и сравнивает с (порог в тенге * 100) без потерь на округление", "Делить сумму тиынов на 100 с округлением в меньшую сторону до целых тенге перед сравнением с порогом", "Хранить и передавать все суммы (включая порог в API) исключительно в тиынах"], "finding_ids": ["D-06"], "requirement_ids": ["R-01", "R-09"], "blocking": true, "answer": ""}, {"qid": "Q-06", "addressee": "Аналитик", "question": "Ф-2 (L38) гласит: «Возврат уменьшает расходы месяца исходной покупки», но в требованиях к данным (L49) отсутствует поле связи с исходной операцией, и не указано, сбрасывается ли флаг отправки push при уменьшении суммы ниже порога. Как должна быть устроена обработка возвратов?", "why": "Без атрибута связи невозможно найти месяц исходной покупки, а отсутствие правила сброса флага нарушит отправку push при повторном росте расходов.", "options": ["Добавить parent_operation_id в модель данных; возврат корректирует расходы месяца покупки, флаг push не сбрасывается", "Добавить parent_operation_id; при уменьшении расходов ниже порога сбрасывать флаг push текущего месяца", "Учитывать возвраты только в открытом текущем месяце по дате самого возврата без связи с покупкой"], "finding_ids": ["D-08", "D-09"], "requirement_ids": ["R-04", "R-05", "R-09"], "blocking": false, "answer": ""}, {"qid": "Q-07", "addressee": "Аналитик", "question": "В Sequence Diagram (L43) указано: «Сервис расходов → push: передать последние четыре цифры карты и сумму при достижении порога», но отсутствует шаблон уведомления и интеграционный контракт. Каковы текст push и структура события?", "why": "Разработчики сервиса расходов и push не смогут согласовать контракт вызова и тексты сообщений для клиентов.", "options": ["Шаблон: «Расходы по карте *{last4} достигли {amount} ₸», контракт JSON: {card_last4, threshold_amount, current_amount}", "Шаблон: «Вы достигли лимита {amount} ₸ по карте *{last4}», контракт JSON: {cardId, amount}", "Передавать идентификатор события EXPENSE_LIMIT_REACHED в единый сервис шаблонизации сообщений"], "finding_ids": ["D-10"], "requirement_ids": ["R-05", "R-07"], "blocking": false, "answer": ""}, {"qid": "Q-08", "addressee": "ИБ", "question": "Параметр `cardId` передаётся в Query-строке (L142), что приводит к логированию PII. Кроме того, L175 описывает статус 403 Forbidden, а L189 указывает: «Для чужой карты возвращается 404, как и для отсутствиющей карты». Какой формат передачи и код ошибки использовать для чужих карт?", "why": "Передача PII в Query создает риски ИБ, а несогласованность кодов 403/404 усложняет обработку ошибок на клиенте.", "options": ["Перенести cardId в body (при переходе на POST) и возвращать 404 Not Found для чужих карт (защита от сканирования)", "Перенести cardId в body и возвращать 403 Forbidden для чужих карт, 404 — только для несуществующих", "Оставить cardId в Query-параметрах и возвращать 404 Not Found"], "finding_i я"}, {"no": 19, "text": "| **Влияние на ИС** | Мобильный банк, карточный процессинг, сервис уведомлений |", "page": null, "section": "Часть A. Новый функционал › Общие сведения"}, {"no": 20, "text": "| **Задача в JIRA** | Практикум без Jira-задачи |", "page": null, "section": "Часть A. Новый функционал › Общие сведения"}, {"no": 21, "text": "", "page": null, "section": "Часть A. Новый функционал › Общие сведения"}, {"no": 22, "text": "### Цели", "page": null, "section": "Часть A. Новый функционал › Цели"}, {"no": 23, "text": "Дать клиенту возможность узнать о достижении личного бюджета в момент покупки.", "page": null, "section": "Часть A. Новый функционал › Цели"}, {"no": 24, "text": "", "page": null, "section": "Часть A. Новый функционал › Цели"}, {"no": 25, "text": "### Архитектура решения", "page": null, "section": "Часть A. Новый функционал › Архитектура решения"}, {"no": 26, "text": "Мобильное приложение → сервис настроек. Карточный процессинг → учёт расходов → сервис push.", "page": null, "section": "Часть A. Новый функционал › Архитектура решения"}, {"no": 27, "text": "", "page": null, "section": "Часть A. Новый функционал › Архитектура решения"}, {"no": 28, "text": "### Дизайн процесса UI", "page": null, "section": "Часть A. Новый функционал › Дизайн процесса UI"}, {"no": 29, "text": "Карты → Расходы → Уведомления. На экране видны переключатель, поле «Порог, ₸», сумма за месяц и кнопка «Сохранить». При ошибке ввода сообщение появляется под полем.", "page": null, "section": "Часть A. Новый функционал › Дизайн процесса UI"}, {"no": 30, "text": "", "page": null, "section": "Часть A. Новый функционал › Дизайн процесса UI"}, {"no": 31, "text": "### Требования к изменениям", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям"}, {"no": 32, "text": "", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям"}, {"no": 33, "text": "#### BPMN схема процесса", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › BPMN схема процесса"}, {"no": 34, "text": "Проведение покупки → пересчёт расходов → проверка порога → при достижении отправка push → завершение.", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › BPMN схема процесса"}, {"no": 35, "text": "", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › BPMN схема процесса"}, {"no": 36, "text": "#### Функциональные требования", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › Функциональные требования"}, {"no": 37, "text": "* **Ф-1.** Держатель активной карты KZT задаёт целый порог от 1 000 до 1 000 000 ₸ включительно. По умолчанию уведомление выключено.", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › Функциональные требования"}, {"no": 38, "text": "* **Ф-2.** Месяц определяется по дате совершения покупки в Алматы. В расходы входят проведённые покупки. Возврат уменьшает расходы месяца исходной покупки. Переводы и снятие наличных исключаются.", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › Функциональные требования"}, {"no": 39, "text": "* **Ф-3.** Когда расходы переходят от суммы ниже порога к сумме, равной порогу или выше, клиент получает push. На карту приходится максимум один такой push за календарный месяц.", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › Функциональные требования"}, {"no": 40, "text": "* **Ф-4.** При изменении порога накопленная сумма сохраняется. Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › Функциональные требования"}, {"no": 41, "text": "", "page": null, "section": "Часть A. Новый функционал › Требования к изменениям › Функциональные требования"}, {"no": 42, "text": "### Sequence Diagram", "page": null, "section": "Часть A. Новый функционал › Sequence Diagram"}, {"no": 43, "text": "Процессинг → сервис расходов: проведена покупка. Сервис расходов → настройки: получить порог карты. Сервис расходов → push: передать последние четыре цифры карты и сумму при достижении порога.", "page": null, "section": "Часть A. Новый функционал › Sequence Diagram"}, {"no": 44, "text": "", "page": null, "section": "Часть A. Новый функционал › Sequence Diagram"}, {"no": 45, "text": "### Нефункциональные требования", "page": null, "section": "Часть A. Новый функционал › Нефункциональные требования"}, {"no": 46, "text": "Сервис передаёт push на отправку в течение минуты после получения события.", "page": null, "section": "Часть A. Новый функционал › Нефункциональные требования"}, {"no": 47, "text": "", "page": null, "section": "Часть A. Новый функционал › Нефункциональные требования"}, {"no": 48, "text": "### Требования к данным", "page": null, "section": "Часть A. Новый функционал › Требования к данным"}, {"no": 49, "text": "Хранить идентификатор карты, месяц, идентификатор операции, сумму покупки в тиынах, признак отправки и порог в тенге.", "page": null, "section": "Часть A. Новый функционал › Требования к данным"}, {"no": 50, "text": "", "page": null, "section": "Часть A. Новый функционал › Требования к данным"}, {"no": 51, "text": "### Требования к интеграции", "page": null, "section": "Часть A. Новый функционал › Требования к интеграции"}, {"no": 52, "text": "Приложение читает и сохраняет настройки через дочерний документ «Уведомление о расходах по карте — REST API». Повторная доставка одного события процессинга сохраняет исходный итог.", "page": null, "section": "Часть A. Новый функционал › Требования к интеграции"}, {"no": 53, "text": "", "page": null, "section": "Часть A. Новый функционал › Требования к интеграции"}, {"no": 54, "text": "### Требования к тестированию", "page": null, "section": "Часть A. Новый функционал › Требования к тестированию"}, {"no": 55, "text": "", "page": null, "section": "Часть A. Новый функционал › Требования к тестированию"}, {"no": 56, "text": "#### Тестирование требований", "page": null, "section": "Часть A. Новый функционал › Требования к тестированию › Тестирование требований"}, {"no": 57, "text": "заполняются тестировщиками", "page": null, "section": "Часть A. Новый функционал › Требования к тестированию › Тестирование требований"}, {"no": 58, "text": "", "page": null, "section": "Часть A. Новый функционал › Требования к тестированию › Тестирование требований"}, {"no": 59, "text": "### Критерии приемки", "page": null, "section": "Часть A. Новый функционал › Критерии приемки"}, {"no": 60, "text": "", "page": null, "section": "Часть A. Новый функционал › Критерии приемки"}, {"no": 61, "text": "| Исходные условия | Действие | Ожидаемый результат |", "page": null, "section": "Часть A. Новый функционал › Критерии приемки"}, {"no": 62, "text": "| :--- | :--- | :--- |", "page": null, "section": "Часть A. Новый функционал › Критерии приемки"}, {"no": 63, "text": "| Расходы 48 500 ₸, порог 50 000 ₸ | Провести покупку на 1 500 ₸ | Итог 50 000 ₸ и один push |", "page": null, "section": "Часть A. Новый функционал › Критерии приемки"}, {"no": 64, "text": "| Покупка 31 января в 23:58 на 4 000 ₸ | Провести 1 февраля в 00:03 по Алматы | Февральский счётчик вырос на 4 000 ₸ |", "page": null, "section": "Часть A. Новый функционал › Критерии приемки"}, {"no": 65, "text": "| Расходы 19 900 ₸, порог 20 000 ₸ | Перевести 500 ₸ | Счётчик показывает 19 900 ₸ |", "page": null, "section": "Часть A. Новый функционал › Критерии приемки"}, {"no": 66, "text": "", "page": null, "section": "Часть A. Новый функционал › Критерии приемки"}, {"no": 67, "text": "### Ревью требований", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 68, "text": "Документ (версия/дата) в источнике не заполнен. Пункты чек-листа приведены как в шаблоне, отметки не проставлены.", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 69, "text": "", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 70, "text": "| Проверка | Создано или доступно | Проверено | Примечания |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 71, "text": "| :--- | :--- | :--- | :--- |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 72, "text": "| Техническое требование зафиксировано и покрывает бизнес-требование | Да / Нет | Да / Нет | |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 73, "text": "| Функциональная спецификация имеет структурированное описание (по стандарту, шаблону) | Да / Нет | Да / Нет | |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 74, "text": "| Sequence-диаграммы, предусмотрены взаимодействия систем, компонентов и решений | Да / Нет / Не требуется | Да / Нет / Не требуется | |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 75, "text": "| Требование покрывает спецификацию UX/UI дизайна | Да / Нет / Не требуется | Да / Нет / Не требуется | |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 76, "text": "| Реализация задачи/проекта предусматривает схему отката решений | Да / Нет / Не требуется | Да / Нет / Не требуется | При невозможности отката — варианты скрытия функционала |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 77, "text": "| Требование может быть протестировано | Да / Нет | Да / Нет | |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 78, "text": "| Требование предусматривает модель данных или поток, содержит описание | Да / Нет / Не требуется | Да / Нет / Не требуется | |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 79, "text": "| Требование не имеет противоречий или явных показателей операционных рисков | Да / Нет | Да / Нет | |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 80, "text": "| Требование содержит архитектуру и согласовано с архитекторами | Да / Нет / Не требуется | Да / Нет / Не требуется | Для архитектуры — чек-лист |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 81, "text": "| Все изменения, влияющие на иные продукты/системы в требовании, согласованы с ответственными лицами | Да / Нет / Не требуется | Да / Нет / Не требуется | |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 82, "text": "| Структура требований не несёт изменений и рисков информационной безопасности | Да / Нет | Да / Нет | По информационной безопасности — чек-лист |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 83, "text": "| В требовании присутствует схема полного бизнес-процесса и часть реализуемой доработки | Да / Нет | Да / Нет | |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 84, "text": "| Требование носит интеграционный характер и имеет четкую постановку реализации интеграционного взаимодействия | Да / Нет / Не требуется | Да / Нет / Не требуется | |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 85, "text": "| Поддерживается версионность документа / зафиксирована | Да / Нет | Да / Нет | |", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 86, "text": "", "page": null, "section": "Часть A. Новый функционал › Ревью требований"}, {"no": 87, "text": "### Блок согласующих", "page": null, "section": "Часть A. Новый функционал › Блок согласующих"}, {"no": 88, "text": "", "page": null, "section": "Часть A. Новый функционал › Блок согласующих"}, {"no": 89, "text": "| Подразделение | ФИО ответственного | Подпись |", "page": null, "section": "Часть A. Новый функционал › Блок согласующих"}, {"no": 90, "text": "| :--- | :--- | :--- |", "page": null, "section": "Часть A. Новый функционал › Блок согласующих"}, {"no": 91, "text": "| | | |", "page": null, "section": "Часть A. Новый функционал › Блок согласующих"}, {"no": 92, "text": "", "page": null, "section": "Часть A. Новый функционал › Блок согласующих"}, {"no": 93, "text": "---", "page": null, "section": "Часть A. Новый функционал › Блок согласующих"}, {"no": 94, "text": "", "page": null, "section": "Часть A. Новый функционал › Блок согласующих"}, {"no": 95, "text": "## Часть B. REST API", "page": null, "section": "Часть B. REST API"}, {"no": 96, "text": "", "page": null, "section": "Часть B. REST API"}, {"no": 97, "text": "Дочерний документ части A: «Уведомление о расходах по карте — REST API».", "page": null, "section": "Часть B. REST API"}, {"no": 98, "text": "", "page": null, "section": "Часть B. REST API"}, {"no": 99, "text": "### Общие параметры", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 100, "text": "", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 101, "text": "| Поле | Значение |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 102, "text": "| :--- | :--- |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 103, "text": "| **Description** | Сохранение порога. Функциональные требования: чтение порога |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 104, "text": "| **REST type** | GET |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 105, "text": "| **Authorization** | Bearer, сессия владельца карты |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 106, "text": "| **Controller** | AlertsController |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 107, "text": "| **URL type** | Dev / Prod |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 108, "text": "| **Request URL** | Dev: `/alerts/saveLimit` . Prod: — |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 109, "text": "| **CURL** | `curl -G \"$BASE/alerts/saveLimit\" -H \"Authorization: Bearer $TOKEN\" --data 'cardId=demo-42&amount=50000&enabled=1'` |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 110, "text": "| **Swagger** | — |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 111, "text": "| **Gitlab project** | Учебный контур |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 112, "text": "| **Framework** | Учебный контур |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 113, "text": "| **Author** | Школа тестирования |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 114, "text": "| **Developer** | Команда практикума |", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 115, "text": "", "page": null, "section": "Часть B. REST API › Общие параметры"}, {"no": 116, "text": "### Логика работы метода", "page": null, "section": "Часть B. REST API › Логика работы метода"}, {"no": 117, "text": "1. Проверить пользовательскую сессию.", "page": null, "section": "Часть B. REST API › Логика работы метода"}, {"no": 118, "text": "2. Проверить принадлежность карты клиенту.", "page": null, "section": "Часть B. REST API › Логика работы метода"}, {"no": 119, "text": "3. Проверить сумму и переключатель.", "page": null, "section": "Часть B. REST API › Логика работы метода"}, {"no": 120, "text": "4. Заменить настройку и вернуть результат сохранения.", "page": null, "section": "Часть B. REST API › Логика работы метода"}, {"no": 121, "text": "5. При отклонении суммы вернуть прежнее состояние и результат ERROR.", "page": null, "section": "Часть B. REST API › Логика работы метода"}, {"no": 122, "text": "", "page": null, "section": "Часть B. REST API › Логика работы метода"}, {"no": 123, "text": "### Особые правила", "page": null, "section": "Часть B. REST API › Особые правила"}, {"no": 124, "text": "1. Целое число тенге, обе границы включены.", "page": null, "section": "Часть B. REST API › Особые правила"}, {"no": 125, "text": "2. Повторное сохранение заменяет действующую настройку.", "page": null, "section": "Часть B. REST API › Особые правила"}, {"no": 126, "text": "3. Изменение порога сохраняет накопленные расходы.", "page": null, "section": "Часть B. REST API › Особые правила"}, {"no": 127, "text": "", "page": null, "section": "Часть B. REST API › Особые правила"}, {"no": 128, "text": "### Схема", "page": null, "section": "Часть B. REST API › Схема"}, {"no": 129, "text": "```text", "page": null, "section": "Часть B. REST API › Схема"}, {"no": 130, "text": "Приложение → AlertsController → хранилище настроек → AlertsController → приложение.", "page": null, "section": "Часть B. REST API › Схема"}, {"no": 131, "text": "```", "page": null, "section": "Часть B. REST API › Схема"}, {"no": 132, "text": "", "page": null, "section": "Часть B. REST API › Схема"}, {"no": 133, "text": "### Параметры запроса", "page": null, "section": "Часть B. REST API › Параметры запроса"}, {"no": 134, "text": "", "page": null, "section": "Часть B. REST API › Параметры запроса"}, {"no": 135, "text": "#### Path-параметры", "page": null, "section": "Часть B. REST API › Параметры запроса › Path-параметры"}, {"no": 136, "text": "Не используются.", "page": null, "section": "Часть B. REST API › Параметры запроса › Path-параметры"}, {"no": 137, "text": "", "page": null, "section": "Часть B. REST API › Параметры запроса › Path-параметры"}, {"no": 138, "text": "#### Query-параметры", "page": null, "section": "Часть B. REST API › Параметры запроса › Query-параметры"}, {"no": 139, "text": "", "page": null, "section": "Часть B. REST API › Параметры запроса › Query-параметры"}, {"no": 140, "text": "| Parameter | Format | Size | Mandatory | Logic | Description | DB field |", "page": null, "section": "Часть B. REST API › Параметры запроса › Query-параметры"}, {"no": 141, "text": "| :--- | :--- | :--- | :--- | :--- | :--- | :--- |", "page": null, "section": "Часть B. REST API › Параметры запроса › Query-параметры"}, {"no": 142, "text": "| `cardId` | string | 1–64 | Да | Карта клиента | Идентификатор карты | `card_id` |", "page": null, "section": "Часть B. REST API › Параметры запроса › Query-параметры"}, {"no": 143, "text": "| `amount` | integer | 32 bit | Да | 1 000–1 000 000 | Порог в тенге | `limit_kzt` |", "page": null, "section": "Часть B. REST API › Параметры запроса › Query-параметры"}, {"no": 144, "text": "| `enabled` | integer | 1 знак | Да | 0 или 1 | Признак включения | `enabled` |", "page": null, "section": "Часть B. REST API › Параметры запроса › Query-параметры"}, {"no": 145, "text": "", "page": null, "section": "Часть B. REST API › Параметры запроса › Query-параметры"}, {"no": 146, "text": "#### Request body", "page": null, "section": "Часть B. REST API › Параметры запроса › Request body"}, {"no": 147, "text": "* **Content-Type:** `application/json` .", "page": null, "section": "Часть B. REST API › Параметры запроса › Request body"}, {"no": 148, "text": "* Тело не используется.", "page": null, "section": "Часть B. REST API › Параметры запроса › Request body"}, {"no": 149, "text": "", "page": null, "section": "Часть B. REST API › Параметры запроса › Request body"}, {"no": 150, "text": "### Ответ", "page": null, "section": "Часть B. REST API › Ответ"}, {"no": 151, "text": "Если результат 200 или 201 — успешный. Если результат 400, 401 и далее — неуспешный.", "page": null, "section": "Часть B. REST API › Ответ"}, {"no": 152, "text": "", "page": null, "section": "Часть B. REST API › Ответ"}, {"no": 153, "text": "| Parameter | Format | Logic | Description | DB field |", "page": null, "section": "Часть B. REST API › Ответ"}, {"no": 154, "text": "| :--- | :--- | :--- | :--- | :--- |", "page": null, "section": "Часть B. REST API › Ответ"}, {"no": 155, "text": "| `result` | string | OK / ERROR | Исход сохранения | — |", "page": null, "section": "Часть B. REST API › Ответ"}, {"no": 156, "text": сть B. REST API › Статусы › 200. Successful — Created"}, {"no": 173, "text": "", "page": null, "section": "Часть B. REST API › Статусы › 200. Successful — Created"}, {"no": 174, "text": "**401.** Ответ в случае, если запрос выполнен без необходимой авторизации.", "page": null, "section": "Часть B. REST API › Статусы › 200. Successful — Created"}, {"no": 175, "text": "**403.** Ответ в случае, если на указанный ресурс доступ запрещен.", "page": null, "section": "Часть B. REST API › Статусы › 200. Successful — Created"}, {"no": 176, "text": "**500.** Ответ в случае, если произошла внутренняя ошибка сервера.", "page": null, "section": "Часть B. REST API › Статусы › 200. Successful — Created"}, {"no": 177, "text": "", "page": null, "section": "Часть B. REST API › Статусы › 200. Successful — Created"}, {"no": 178, "text": "#### 400. Unsuccessful — Bad request", "page": null, "section": "Часть B. REST API › Статусы › 400. Unsuccessful — Bad request"}, {"no": 179, "text": "```json", "page": null, "section": "Часть B. REST API › Статусы › 400. Unsuccessful — Bad request"}, {"no": 180, "text": "{\"message\":\"Некорректный запрос\"}", "page": null, "section": "Часть B. REST API › Статусы › 400. Unsuccessful — Bad request"}, {"no": 181, "text": "```", "page": null, "section": "Часть B. REST API › Статусы › 400. Unsuccessful — Bad request"}, {"no": 182, "text": "", "page": null, "section": "Часть B. REST API › Статусы › 400. Unsuccessful — Bad request"}, {"no": 183, "text": "#### 401. Unsuccessful — Unauthorized", "page": null, "section": "Часть B. REST API › Статусы › 401. Unsuccessful — Unauthorized"}, {"no": 184, "text": "```json", "page": null, "section": "Часть B. REST API › Статусы › 401. Unsuccessful — Unauthorized"}, {"no": 185, "text": "{\"message\":\"Требуется вход\"}", "page": null, "section": "Часть B. REST API › Статусы › 401. Unsuccessful — Unauthorized"}, {"no": 186, "text": "```", "page": null, "section": "Часть B. REST API › Статусы › 401. Unsuccessful — Unauthorized"}, {"no": 187, "text": "", "page": null, "section": "Часть B. REST API › Статусы › 401. Unsuccessful — Unauthorized"}, {"no": 188, "text": "#### 403. Unsuccessful — Forbidden", "page": null, "section": "Часть B. REST API › Статусы › 403. Unsuccessful — Forbidden"}, {"no": 189, "text": "Для чужой карты возвращается 404, как и для отсутствующей карты.", "page": null, "section": "Часть B. REST API › Статусы › 403. Unsuccessful — Forbidden"}, {"no": 190, "text": "**404**", "page": null, "section": "Часть B. REST API › Статусы › 403. Unsuccessful — Forbidden"}, {"no": 191, "text": "```json", "page": null, "section": "Часть B. REST API › Статусы › 403. Unsuccessful — Forbidden"}, {"no": 192, "text": "{\"message\":\"Карта не найдена\"}", "page": null, "section": "Часть B. REST API › Статусы › 403. Unsuccessful — Forbidden"}, {"no": 193, "text": "```", "page": null, "section": "Часть B. REST API › Статусы › 403. Unsuccessful — Forbidden"}, {"no": 194, "text": "", "page": null, "section": "Часть B. REST API › Статусы › 403. Unsuccessful — Forbidden"}, {"no": 195, "text": "#### 500. Unsuccessful — Internal server error", "page": null, "section": "Часть B. REST API › Статусы › 500. Unsuccessful — Internal server error"}, {"no": 196, "text": "```json", "page": null, "section": "Часть B. REST API › Статусы › 500. Unsuccessful — Internal server error"}, {"no": 197, "text": "{\"message\":\"Ошибка сервиса\"}", "page": null, "section": "Часть B. REST API › Статусы › 500. Unsuccessful — Internal server error"}, {"no": 198, "text": "```", "page": null, "section": "Часть B. REST API › Статусы › 500. Unsuccessful — Internal server error"}], "criteria": {"necessary": {"name": "Необходимость", "level": "requirement", "source": "29148 п. 5.2.5", "definition": "Требование задаёт важную возможность или ограничение; без него продукт неполон, а его удаление ничего не ломает только если оно лишнее."}, "appropriate": {"name": "Уместность (без лишних проектных решений)", "level": "requirement", "source": "29148 п. 5.2.5", "definition": "Требование описывает что нужно, а не как реализовать; уровень детализации соответствует уровню документа."}, "unambiguous": {"name": "Однозначность", "level": "requirement", "source": "29148 п. 5.2.5; IEEE 830 п. 4.3.2", "definition": "Формулировку можно понять только одним способом; термины, единицы, границы, часовые пояса и состояния определены."}, "complete": {"name": "Полнота", "level": "requirement", "source": "29148 п. 5.2.5; IEEE 830 п. 4.3.3", "definition": "Требование не нуждается в дополнении: описаны условия, реакции на ошибки и граничные/альтернативные случаи."}, "singular": {"name": "Атомарность", "level": "requirement", "source": "29148 п. 5.2.5", "definition": "Одно требование — одна возможность или одно ограничение."}, "feasible": {"name": "Реализуемость", "level": "requirement", "source": "29148 п. 5.2.5 и 5.2.6", "definition": "Требование можно реализовать в заданных ограничениях (технических, временных, архитектурных) с приемлемым риском."}, "verifiable": {"name": "Проверяемость", "level": "requirement", "source": "29148 п. 5.2.5; IEEE 830 п. 4.3.6", "definition": "Есть объективный конечный способ доказать выполнение: измеримый результат, точка измерения, условия."}, "correct": {"name": "Корректность", "level": "requirement", "source": "29148 п. 5.2.5; IEEE 830 п. 4.3.1", "definition": "Требование точно отражает потребность и не противоречит цели, бизнес-правилам и предметной области."}, "conforming": {"name": "Соответствие шаблону", "level": "requirement", "source": "29148 п. 5.2.5", "definition": "Требование оформлено по принятому шаблону: идентификатор, раздел, обязательные поля и атрибуты заполнены."}, "consistent": {"name": "Непротиворечивость", "level": "set", "source": "29148 п. 5.2.6; IEEE 830 п. 4.3.4", "definition": "Требования, критерии приёмки и части документа не противоречат друг другу; термины и единицы используются единообразно."}, "set_complete": {"name": "Полнота набора", "level": "set", "source": "29148 п. 5.2.6; IEEE 830 п. 4.3.3", "definition": "Набор покрывает цель и все значимые сценарии, ошибки, состояния и интерфейсы; нет пустых обязательных разделов и «TBD»."}, "comprehensible": {"name": "Понятность", "level": "set", "source": "29148 п. 5.2.6", "definition": "Из набора ясно, что ожидается от системы и как требования связаны; термины определены."}, "validatable": {"name": "Возможность валидации", "level": "set", "source": "29148 п. 5.2.6", "definition": "Можно доказать, что выполнение набора достигает бизнес-цели (есть критерии приёмки, измеримые цели)."}, "ranked": {"name": "Ранжированность", "level": "set", "source": "IEEE 830 п. 4.3.5", "definition": "У требований указаны важность и/или стабильность (приоритеты)."}, "modifiable": {"name": "Модифицируемость", "level": "set", "source": "IEEE 830 п. 4.3.7", "definition": "Структура позволяет вносить изменения без дублей и рассинхронизации; документ версионируется."}, "traceable": {"name": "Трассируемость", "level": "set", "source": "IEEE 830 п. 4.3.8; 29148 п. 5.2.8", "definition": "У требований есть уникальные идентификаторы и связи с источником, критериями приёмки и реализующими спецификациями."}, "language": {"name": "Язык требований", "level": "requirement", "source": "29148 п. 5.2.7", "definition": "Нет субъективных и размытых слов, лазеек («по возможности»), незамкнутых перечислений («и т.д.»), неизмеримых сравнений."}, "risk": {"name": "Риски ИБ и эксплуатации", "level": "requirement", "source": "Чек-лист ревью (ИБ, операционные риски)", "definition": "Требование не создаёт рисков информационной безопасности, утечки персональных и карточных данных, операционных рисков; предусмотрены откат и контроль."}}, "severity_names": {"critical": "Критично", "major": "Существенно", "minor": "Замечание"}, "kind_names": {"functional": "функциональное", "nonfunctional": "нефункциональное", "data": "данные", "integration": "интеграция", "interface": "UI", "api": "API", "acceptance": "критерий пр $('passport-line').textContent = `${p.file} · ${new Date(p.started_at).toLocaleString('ru-RU')} · модель ${p.model_versions.join(', ') || p.model} · ${p.agent_version}`;
const ready = D.verdict.ready_for_development;
$('verdict').className = 'verdict ' + (ready ? 'yes' : 'no');
$('verdict').textContent = ready ? '✅ Можно в разработку' : '❌ Не готов к разработке';
const C = D.counts;
$('kpis').innerHTML = [
  ['', C.requirements, 'требований выделено'],
  ['crit', C.critical, 'критичных дефектов'],
  ['major', C.major, 'существенных'],
  ['minor', C.minor, 'замечаний'],
  ['', C.questions, `уточняющих вопросов (${C.blocking} блок.)`],
  ['ok', `${p.quotes_verified}/${p.quotes_checked}`, 'цитат подтверждено в документе'],
].map(([cls, v, l]) => `<div class="kpi ${cls}"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('');

// ---------- tabs
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => openTab(b.dataset.tab));
function openTab(name){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.panel').forEach(s => s.classList.toggle('active', s.id === 'p-' + name));
}
$('theme').onclick = () => {
  const r = document.documentElement; const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = r.dataset.theme || (dark ? 'dark' : 'light'); r.dataset.theme = cur === 'dark' ? 'light' : 'dark';
};

// ---------- defects
const state = {sev:new Set(['critical','major','minor']), crit:'', q:'', open:true};
function reqChip(rid){ const r = reqById[rid]; return `<span class="pill" title="${esc(r ? r.summary : '')}">${esc(rid)}${r && r.source_id ? ' · ' + esc(r.source_id) : ''}</span>`; }
function defectCard(f){
  const ev = f.evidence.map(e => `<span class="quote" data-line="${e.line_start}">«${esc(e.quote)}»<small>${esc(e.location)}</small></span>`).join('');
  const status = f.status === 'resolved' ? `<span class="pill ok">закрыто уточнением</span>` : f.status === 'changed' ? `<span class="pill">изменено после уточнения</span>` : '';
  return `<article class="card sev-${f.severity}" id="${f.fid}">
    <h3><span class="pill ${f.severity}">${SEV[f.severity]}</span>${esc(f.fid)}. ${esc(f.title)} ${status}</h3>
    <div class="meta">${esc(crit(f.criterion))} — ${esc((D.criteria[f.criterion]||{}).source||'')} · обнаружили: ${esc(who(f.sources))}</div>
    <div>${f.requirement_ids.map(reqChip).join('')}</div>
    ${ev}
    <dl><dt>Проблема</dt><dd>${esc(f.problem)}</dd><dt>Что исправить</dt><dd>${esc(f.recommendation)}</dd>
    ${f.status_comment ? `<dt>После уточнения</dt><dd>${esc(f.status_comment)}</dd>` : ''}</dl>
    ${f.rewrite ? `<div class="rewrite"><b>Предлагаемая формулировка:</b> ${esc(f.rewrite)}</div>` : ''}
  </article>`;
}
function renderDefects(){
  const crits = [...new Set(D.findings.map(f => f.criterion))];
  const list = D.findings.filter(f => state.sev.has(f.severity) && (!state.crit || f.criterion === state.crit)
     && (!state.open || f.status !== 'resolved')
     && (!state.q || (f.title + f.problem + f.recommendation + f.evidence.map(e=>e.quote).join(' ')).toLowerCase().includes(state.q)));
  const prio = D.findings.filter(f => f.priority > 0 && f.status !== 'resolved').sort((a,b) => a.priority - b.priority);
  $('p-defects').innerHTML = `
    <div class="card"><h3>Итог</h3><div>${esc(D.verdict.summary)}</div>
      ${prio.length ? `<p class="meta" style="margin-bottom:4px">Исправить в первую очередь:</p><ol style="margin:0">${prio.map(f => `<li><a href="#${f.fid}">${esc(f.fid)}</a> — ${esc(f.title)}</li>`).join('')}</ol>` : ''}
    </div>
    <div class="filters">
      ${['critical','major','minor'].map(s => `<button class="chip ${state.sev.has(s)?'on':''}" data-sev="${s}">${SEV[s]}</button>`).join('')}
      <select id="f-crit"><option value="">Все критерии</option>${crits.map(c => `<option value="${c}" ${state.crit===c?'selected':''}>${esc(crit(c))}</option>`).join('')}</select>
      <input id="f-q" placeholder="Поиск по дефектам" value="${esc(state.q)}">
      <label class="meta"><input type="checkbox" id="f-open" ${state.open?'checked':''}> только открытые</label>
      <span class="meta">Показано: ${list.length} из ${D.findings.length}</span>
    </div>
    ${list.map(defectCard).join('') || '<p class="meta">Нет дефектов по выбранным фильтрам.</p>'}`;
  document.querySelectorAll('[data-sev]').forEach(b => b.onclick = () => { const s=b.dataset.sev; state.sev.has(s)?state.sev.delete(s):state.sev.add(s); renderDefects(); });
  $('f-crit').onchange = e => { state.crit = e.target.value; renderDefects(); };
  $('f-q').oninput = e => { state.q = e.target.value.toLowerCase(); clearTimeout(window._t); window._t = setTimeout(() => { renderDefects(); $('f-q').focus(); const v=$('f-q').value; $('f-q').setSelectionRange(v.length,v.length); }, 250); };
  $('f-open').onchange = e => { state.open = e.target.checked; renderDefects(); };
  document.querySelectorAll('.quote').forEach(q => q.onclick = () => goLine(+q.dataset.line));
}

// ---------- document view
function renderDoc(){
  const marks = {};
  for (const f of D.findings) { if (f.status === 'resolved') continue;
    for (const e of f.evidence) { if (!e.line_start) continue;
      for (let n = e.line_start; n <= (e.line_end || e.line_start); n++) {
        const m = marks[n] || (marks[n] = {sev:'minor', ids:[]});
        if (SEV_RANK[f.severity] < SEV_RANK[m.sev]) m.sev = f.severity;
        if (!m.ids.includes(f.fid)) m.ids.push(f.fid);
  }}}
  const reqStart = {};
  for (const r of D.requirements) if (r.evidence.line_start) (reqStart[r.evidence.line_start] ||= []).push(r.rid);
  $('p-doc').innerHTML = `<p class="meta">Исходный документ построчно. Подсвечены строки, на которые ссылаются дефекты; нажмите на номер дефекта, чтобы открыть его.</p>
   <div class="doc">${D.doc_lines.map(l => { const m = marks[l.no];
     return `<div class="ln ${m ? 'h-' + m.sev : ''}" id="L${l.no}"><span class="n">${l.no}</span><span class="t">${esc(l.text)}</span><span class="m">${(reqStart[l.no]||[]).map(r => `<span class="pill">${r}</span>`).join('')}${m ? m.ids.map(id => `<a data-f="${id}">${id}</a>`).join('') : ''}</span></div>`; }).join('')}</div>`;
  document.querySelectorAll('[data-f]').forEach(a => a.onclick = () => { openTab('defects'); state.sev = new Set(['critical','major','minor']); state.crit=''; state.q=''; state.open=false; renderDefects(); setTimeout(() => document.getElementById(a.dataset.f)?.scrollIntoView({behavior:'smooth', block:'center'}), 50); });
}
function goLine(n){ if (!n) return; openTab('doc'); const el = $('L' + n); if (!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); }

// ---------- requirements heatmap
function renderReqs(){
  const cols = Object.entries(D.criteria).filter(([c, v]) => D.findings.some(f => f.criterion === c));
  const cell = (rid, c) => { const fs = D.findings.filter(f => f.status !== 'resolved' && f.criterion === c && f.requirement_ids.includes(rid));
    if (!fs.length) return '<td></td>';
    const worst = fs.map(f => f.severity).sort((a,b) => SEV_RANK[a]-SEV_RANK[b])[0];
    return `<td class="c-${worst}" title="${esc(fs.map(f => f.fid + ' ' + f.title).join('\n'))}">${fs.length}</td>`; };
  $('p-reqs').innerHTML = `
    <h3>Тепловая карта: требование × критерий</h3><p class="meta">Цвет — наихудшая критичность, число — количество дефектов. Наведите курсор на ячейку, чтобы увидеть дефекты.</p>
    <div class="scroll"><table class="heat"><thead><tr><th>Требование</th>${cols.map(([c, v]) => `<th class="v" title="${esc(v.source)}">${esc(v.name)}</th>`).join('')}</tr></thead>
    <tbody>${D.requirements.map(r => `<tr><td style="text-align:left;white-space:nowrap"><b>${r.rid}</b> ${esc(r.source_id || '')}</td>${cols.map(([c]) => cell(r.rid, c)).join('')}</tr>`).join('')}</tbody></table></div>
    <h3 style="margin-top:24px">Как агент нарезал требования</h3>
    <div class="scroll"><table><thead><tr><th>ID</th><th>ID или место в документе</th><th>Тип</th><th>Краткая формулировка</th><th>Цитата</th><th>Место</th></tr></thead>
    <tbody>${D.requirements.map(r => `<tr><td><b>${r.rid}</b></td><td>${esc(r.source_id || '— (нет номера)')}</td><td>${esc(D.kind_names[r.kind] || r.kind)}</td><td>${esc(r.summary)}</td><td><span class="quote" data-line="${r.evidence.line_start}">«${esc(r.evidence.quote)}»</span></td><td>${esc(r.evidence.location)}</td></tr>`).join('')}</tbody></table></div>
    ${D.trace.length ? `<h3 style="margin-top:24px">Трассируемость</h3><div class="scroll"><table><thead><tr><th>Требование</th><th>Проверяется критериями приёмки</th><th>Реализуется</th><th>Замечание</th></tr></thead><tbody>
      ${D.trace.map(t => `<tr><td><b>${t.requirement_id}</b> ${esc((reqById[t.requirement_id]||{}).source_id||'')}</td><td>${t.verified_by.join(', ') || '<span class="pill critical">нет</span>'}</td><td>${t.implemented_by.join(', ') || '—'}</td><td>${esc(t.note)}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
  document.querySelectorAll('#p-reqs .quote').forEach(q => q.onclick = () => goLine(+q.dataset.line));
}

// ---------- questions (форма ответов)
function renderQuestions(){
  $('p-questions').innerHTML = `
    <div class="card"><b>Как ответить.</b> Выберите вариант или напишите свой ответ, затем нажмите «Скачать ответы». Передайте файл агенту:
      <div style="margin-top:6px"><code>python -m revizor ${esc(p.file)} report.md --answers answers.json</code></div>
      Агент перепроверит дефекты с учётом ответов и отметит закрытые.</div>
    ${D.questions.map(q => `<article class="card ${q.blocking ? 'sev-critical' : ''}">
      <h3>${esc(q.qid)} ${q.blocking ? '<span class="pill critical">блокирующий</span>' : ''}<span class="pill">${esc(q.addressee)}</span>
        ${q.finding_ids.map(id => `<a class="pill" href="#${id}" data-go="${id}">${id}</a>`).join('')}</h3>
      <div>${esc(q.question)}</div>
      <div style="margin:8px 0">${q.options.map((o, i) => `<label class="opt"><input type="radio" name="${q.qid}" value="${esc(o)}" ${q.answer === o ? 'checked' : ''}> <span>${i + 1}. ${esc(o)}</span></label>`).join('')}</div>
      <textarea rows="2" data-q="${q.qid}" placeholder="Свой ответ (необязательно)">${q.answer && !q.options.includes(q.answer) ? esc(q.answer) : ''}</textarea>
      <div class="meta" style="margin-top:6px">Зачем: ${esc(q.why)}</div>
    </article>`).join('') || '<p class="meta">Вопросов нет.</p>'}
    ${D.questions.length ? `<div class="toolbar"><button class="btn" id="dl-answers">Скачать ответы (answers.json)</button></div>` : ''}`;
  document.querySelectorAll('[data-go]').forEach(a => a.onclick = ev => { ev.preventDefault(); openTab('defects'); state.open=false; state.sev = new Set(['critical','major','minor']); renderDefects(); setTimeout(() => document.getElementById(a.dataset.go)?.scrollIntoView({behavior:'smooth', block:'center'}), 50); });
  const btn = $('dl-answers');
  if (btn) btn.onclick = () => {
    const out = {};
    for (const q of D.questions) {
      const txt = document.querySelector(`textarea[data-q="${q.qid}"]`).value.trim();
      const radio = document.querySelector(`input[name="${q.qid}"]:checked`);
      const a = txt || (radio ? radio.value : '');
      if (a) out[q.qid] = a;
    }
    const blob = new Blob([JSON.stringify(out, null, 2)], {type: 'application/json'});
    const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'answers.json'; link.click();
  };
}

// ---------- checklist, tests, run
function renderChecklist(){
  $('p-checklist').innerHTML = D.checklist.length ? `<p class="meta">Чек-лист «Ревью требований» из шаблона документа, заполненный агентом.</p>
    <div class="scroll"><table><thead><tr><th>Проверка</th><th>Ответ агента</th><th>Комментарий</th><th>Дефекты</th></tr></thead><tbody>
    ${D.checklist.map(c => `<tr><td>${esc(c.item)}</td><td><span class="pill ${c.answer === 'Да' ? 'ok' : c.answer === 'Нет' ? 'critical' : ''}">${esc(c.answer)}</span></td><td>${esc(c.comment)}</td><td>${c.finding_ids.map(id => `<a href="#${id}" data-go2="${id}">${id}</a>`).join(', ') || '—'}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="meta">В документе нет чек-листа ревью.</p>';
  document.querySelectorAll('[data-go2]').forEach(a => a.onclick = ev => { ev.preventDefault(); openTab('defects'); state.open=false; renderDefects(); setTimeout(() => document.getElementById(a.dataset.go2)?.scrollIntoView({behavior:'smooth', block:'center'}), 50); });
}
function renderTests(){
  $('p-tests').innerHTML = D.tests.length ? `<p class="meta">Тест-кейсы, которых не хватает в критериях приёмки. Ожидаемый результат выведен из требований.</p>
    <div class="scroll"><table><thead><tr><th>ID</th><th>Требования</th><th>Сценарий</th><th>Исходные условия</th><th>Действие</th><th>Ожидаемый результат</th><th>Что не покрыто</th></tr></thead><tbody>
    ${D.tests.map(t => `<tr><td>${t.tid}</td><td>${t.requirement_ids.join(', ')}</td><td>${esc(t.title)}</td><td>${esc(t.preconditions)}</td><td>${esc(t.action)}</td><td>${esc(t.expected)}</td><td>${esc(t.gap)}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="meta">Тест-кейсов нет.</p>';
}
function renderRun(){
  const calls = D.llm_calls, tin = calls.reduce((s,c)=>s+c.prompt_tokens,0), tout = calls.reduce((s,c)=>s+c.output_tokens+c.thoughts_tokens,0);
  $('p-run').innerHTML = `
    <div class="card"><h3>Конвейер агентов</h3>
      <div class="flow"><span>Документ</span><i>→</i><span>Нарезчик</span><i>→</i><span>Правила (код)</span><i>→</i><span>Аналитик · Тестировщик · Архитектор · ИБ</span><i>→</i><span>Согласованность набора</span><i>→</i><span>Проверка цитат (код)</span><i>→</i><span>Судья</span><i>→</i><span>Уточнения</span><i>⇄</i><span>Человек → Перепроверка</span></div>
      <div class="meta">Цитат проверено ${p.quotes_checked}, подтверждено ${p.quotes_verified}. Находок отброшено как неподтверждённые: ${D.unverified.length}. Отклонено судьёй: ${D.rejected.length}.</div></div>
    <div class="scroll"><table><thead><tr><th>Шаг</th><th>Исполнитель</th><th>Время, с</th><th>Результат</th></tr></thead><tbody>
      ${D.steps.map(s => `<tr><td>${esc(s.title)}</td><td>${esc(s.kind)}</td><td>${s.seconds}</td><td>${s.ok ? '' : '⚠️ '}${esc(s.note)}</td></tr>`).join('')}</tbody></table></div>
    <h3 style="margin-top:24px">Вызовы модели</h3>
    <div class="scroll"><table><thead><tr><th>Агент</th><th>Модель</th><th>Кэш</th><th>Время, с</th><th>Токены вход / выход</th></tr></thead><tbody>
      ${calls.map(c => `<tr><td>${esc(D.agent_names[c.agent] || c.agent)}</td><td><code>${esc(c.model_version)}</code></td><td>${c.cached ? 'да' : 'нет'}</td><td>${c.seconds}</td><td>${c.prompt_tokens} / ${c.output_tokens + c.thoughts_tokens}</td></tr>`).join('')}
      <tr><td colspan="4"><b>Итого</b></td><td><b>${tin} / ${tout}</b></td></tr></tbody></table></div>
    <h3 style="margin-top:24px">Паспорт</h3>
    <div class="scroll"><table><tbody>
      <tr><th>Документ</th><td>${esc(p.document_title)}</td></tr><tr><th>Файл</th><td>${esc(p.file)} (${esc(p.format)})</td></tr>
      <tr><th>SHA-256</th><td><code>${esc(p.sha256)}</code></td></tr><tr><th>Начало / конец</th><td>${esc(p.started_at)} — ${esc(p.finished_at)}</td></tr>
      <tr><th>Модель</th><td>${esc(p.provider)} / ${esc(p.model)}; фактически: ${esc(p.model_versions.join(', '))}</td></tr>
      <tr><th>Версия агента</th><td>${esc(p.agent_version)}</td></tr></tbody></table></div>`;
}
renderDefects(); renderDoc(); renderReqs(); renderQuestions(); renderChecklist(); renderTests(); renderRun();
if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
</script>
</body>
</html>
